  <circle cx="85" cy="103" r="1.3" fill="#FFFFFF" opacity="0.9" />
  <circle cx="95" cy="98" r="1.4" fill="#FFFFFF" opacity="0.9" />
  <circle cx="106" cy="91" r="1.4" fill="#FFFFFF" opacity="0.9" />
  <circle cx="118" cy="83" r="1.3" fill="#FFFFFF" opacity="0.8" />
  <circle cx="128" cy="74" r="1.2" fill="#FFFFFF" opacity="0.8" />
  <circle cx="82" cy="107" r="1" fill="#FFFFFF" opacity="0.7" />
  <circle cx="92" cy="104" r="1.1" fill="#FFFFFF" opacity="0.7" />
  <circle cx="102" cy="98" r="1.1" fill="#FFFFFF" opacity="0.7" />
  <circle cx="113" cy="91" r="1" fill="#FFFFFF" opacity="0.7" />
  <circle cx="122" cy="81" r="1" fill="#FFFFFF" opacity="0.7" />
