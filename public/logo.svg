<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Golden Celestial Arc -->
  <circle cx="95" cy="85" r="54" stroke="#C9A24A" stroke-width="2.5" fill="none" opacity="0.9" />
  
  <!-- Guiding Celestial Star -->
  <g transform="translate(100, 60)">
    <path d="M0 -12 Q0 0 12 0 Q0 0 0 12 Q0 0 -12 0 Q0 0 0 -12 Z" fill="#C9A24A" />
    <circle cx="0" cy="0" r="1.5" fill="#FAF8F5" />
  </g>

  <!-- Whale Shark Silhouette (Azul Océano #102B45) -->
  <path d="M 45 105 
           C 50 115, 65 125, 90 120 
           C 115 115, 138 90, 150 65 
           C 152 61, 149 58, 145 61 
           C 135 69, 120 85, 105 95 
           C 92 104, 75 108, 55 103 
           C 48 101, 42 102, 45 105 Z" 
        fill="#102B45" />

  <!-- Dorsal & Pectoral Fins -->
  <path d="M 80 102 C 78 88, 70 85, 68 85 C 72 90, 75 97, 78 104 Z" fill="#102B45" />
  <path d="M 125 84 C 132 78, 138 80, 140 85 C 136 86, 129 88, 123 90 Z" fill="#102B45" />
  <path d="M 128 108 C 135 118, 138 126, 137 132 C 132 126, 128 118, 124 110 Z" fill="#102B45" />

  <!-- Whale Shark Tail -->
  <path d="M 45 105 C 40 106, 32 108, 30 114 C 33 112, 38 110, 44 110 C 40 115, 36 122, 34 125 C 38 120, 43 113, 48 110 Z" fill="#102B45" />

  <!-- Subtle Starlight / Whale Pattern Dots -->
